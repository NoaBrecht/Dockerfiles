services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - media_jellyfin-config:/config
      - media_jellyfin-cache:/cache
      - /media/movies:/media/movies
      - /media/shows:/media/shows
    restart: unless-stopped
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.local`)"
      - "traefik.http.routers.jellyfin.entrypoints=web"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports:
      - "5055:5055"
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Brussels
    volumes:
      - /media/jellyseerr-config:/app/config
    restart: unless-stopped
    depends_on:
      - jellyfin
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
      - WEBUI_PORT=8080
    volumes:
      - media_qbittorrent-config:/config
      - /media/downloads:/downloads
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - media_radarr-config:/config
      - /media/movies:/movies
      - /media/downloads:/downloads
    restart: unless-stopped
    depends_on:
      - prowlarr
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
    volumes:
      - media_sonarr-config:/config
      - /media/shows:/shows
      - /media/downloads:/downloads
    restart: unless-stopped
    depends_on:
      - prowlarr
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
      - FLARESOLVERR_HOST=${FLARESOLVERR_HOST}
    volumes:
      - media_prowlarr-config:/config
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped
  mp4-to-mkv:
    image: alpine:3.20
    container_name: mp4-to-mkv
    restart: unless-stopped
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Brussels
      - SCAN_INTERVAL=60        # seconds between scans
      - MIN_AGE_MINUTES=2       # skip files that are still being written
      - DELETE_ORIGINAL=false   # remove the .mp4 after a successful conversion
    volumes:
      - /media/movies:/watch/movies
      - /media/shows:/watch/shows
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache ffmpeg tzdata > /dev/null || exit 1
        trap 'exit 0' TERM INT
        SKIP=/tmp/skip
        touch "$$SKIP"

        log() {
          echo "$$(date '+%F %T') $$*"
        }

        # Copy all streams into MKV; if subtitles can't be converted, retry without them.
        remux() {
          ffmpeg -nostdin -loglevel error -y -i "$$1" \
            -map 0 -map -0:d? -c copy -c:s srt -f matroska "$$2" ||
          ffmpeg -nostdin -loglevel error -y -i "$$1" \
            -map 0:v -map 0:a? -c copy -f matroska "$$2"
        }

        convert() {
          src="$$1"
          dst="$${src%.*}.mkv"
          tmp="$$dst.part"

          grep -qxF "$$src" "$$SKIP" && return

          if [ -e "$$dst" ]; then
            log "Skipped, MKV already exists: $$src"
            echo "$$src" >> "$$SKIP"
            return
          fi

          log "Converting: $$src"
          if remux "$$src" "$$tmp"; then
            touch -r "$$src" "$$tmp"
            mv "$$tmp" "$$dst"
            chown "$$PUID:$$PGID" "$$dst"
            [ "$$DELETE_ORIGINAL" = true ] && rm -f "$$src"
            log "Done: $$dst"
          else
            rm -f "$$tmp"
            echo "$$src" >> "$$SKIP"
            log "Failed: $$src"
          fi
        }

        log "Watching /watch (delete original: $$DELETE_ORIGINAL)"
        while true; do
          find /watch -type f -iname '*.mp4' -mmin +"$$MIN_AGE_MINUTES" |
            while IFS= read -r f; do convert "$$f"; done
          sleep "$$SCAN_INTERVAL" & wait $$!
        done
volumes:
  media_jellyfin-config:
  media_jellyfin-cache:
  media_qbittorrent-config:
  media_radarr-config:
  media_sonarr-config:
  media_prowlarr-config:
networks:
  traefik-net:
    external: true
